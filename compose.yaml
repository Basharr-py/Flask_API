

services:
  web:
    image: basharr99/flask_api:1.0.1
    container_name: flask_app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 100s
      timeout: 5s
      retries: 3
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      # SQLAlchemy will pick this up instead of falling back to SQLite
      DATABASE_URL: postgresql://${POSTGRES_USER}:bar@${POSTGRES_DB}:${POSTGRES_PORT}/${POSTGRES_DB}
    depends_on:
      - db

  db:
    env_file:
      - .env
    image: postgres:16
    container_name: postgres_db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 3
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
