

services:
  nginx:
    ports:
        - 80:80
        - 443:443
    volumes:
        - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
        - /etc/letsencrypt:/etc/letsencrypt:ro

    container_name: nginx-cont
    image: nginx:alpine
    depends_on:
        db:
            condition: service_healthy
    networks:
      - frontend


  web:
    image: basharr99/flask_app:${image_tag}
    container_name: flask_app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 10s
      timeout: 5s
      retries: 3
    expose:
      - "5000"
    env_file:
      - .env
    environment:
      # SQLAlchemy will pick this up instead of falling back to SQLite
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:${POSTGRES_PORT}/${POSTGRES_DB}
      AWS_REGION: us-east-1
      S3_MATERIALS_BUCKET: basharr-ansible-ssm-380142015153
    depends_on:
      db:
        condition: service_healthy
      

    networks:
      - backend
      - frontend

  db:
    env_file:
      - .env
    image: postgres:16
    container_name: postgres_db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 3
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend

volumes:
  postgres_data:

networks:
    frontend:
        name: frontend
    backend:
        name: backend