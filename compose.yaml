version: "3.9"

services:
  web:
    build: .
    container_name: flask_app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 100s
      timeout: 5s
      retries: 3
    ports:
      - "8000:8000"
    environment:
      # SQLAlchemy will pick this up instead of falling back to SQLite
      DATABASE_URL: postgres://foo:bar@db:5432/postgres
      # Optional: Flask environment settings
      FLASK_ENV: development
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    container_name: postgres_db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "app_user"]
      interval: 10s
      timeout: 5s
      retries: 3
    environment:
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: bar
      POSTGRES_DB: app_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
