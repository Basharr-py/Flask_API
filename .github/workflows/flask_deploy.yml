
name: Deploy to Public EC2 via Ansible SSH
env:
  SECRET_KEY: ${{ secrets.SECRET_KEY }}


on:
  workflow_dispatch:
    # inputs:
    #   image_tag:
    #     description: "Docker image tag to deploy"
    #     required: true
    #     type: string

permissions:
  contents: read
  id-token: write


jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Flask API
        uses: actions/checkout@v4
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/flask_app:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/flask_app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
        
  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      # - name: Display Selected Image
      #   env:
      #     IMAGE_TAG: ${{ inputs.image_tag }}
      #   run: echo "Deploying basharr99/flask_app:$IMAGE_TAG"

      - name: Checkout Flask API
        uses: actions/checkout@v4
        with:
          path: Flask_API

      - name: Checkout Ansible repository
        uses: actions/checkout@v4
        with:
          repository: Basharr-py/Ansible-Config
          path: ansible-lab

      - name: Install Ansible
        run: |
          python -m pip install ansible

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          SSH_HOST_KEY: ${{ secrets.EC2_SSH_HOST_KEY }}
        run: |
          install -d -m 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/ec2_key.pem
          chmod 600 ~/.ssh/ec2_key.pem

          printf '%s\n' "$SSH_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.IAM_ROLE }}
          aws-region: us-east-1

      - name: Download PostgreSQL backup from S3
        run: |
          mkdir -p "$RUNNER_TEMP/db-backup"

          aws s3 cp \
            s3://basharr-ansible-ssm-380142015153/database-backups/db.dump \
            "$RUNNER_TEMP/db-backup/db.dump"

          test -s "$RUNNER_TEMP/db-backup/db.dump"

      - name: Restore Ansible Vault password file
        env:
          VAULT_FILE_B64: ${{ secrets.ANSIBLE_VAULT_FILE_B64 }}
        run: |
          umask 077
          printf '%s' "$VAULT_FILE_B64" | base64 --decode > "$HOME/ansible-vault.pass"
          chmod 600 "$HOME/ansible-vault.pass"
      
      - name: Test Ansible SSH connection
        working-directory: ansible-lab
        env:
          ANSIBLE_PRIVATE_KEY_FILE: /home/runner/.ssh/ec2_key.pem
          ANSIBLE_HOST_KEY_CHECKING: "True"
        run: |
          ansible flask_web \
            -i inventories/for_flask \
            -m ping

      - name: Run Ansible deployment
        working-directory: ansible-lab
        env:
          ANSIBLE_PRIVATE_KEY_FILE: /home/runner/.ssh/ec2_key.pem
          ANSIBLE_HOST_KEY_CHECKING: "True"
          ANSIBLE_VAULT_PASSWORD_FILE: $HOME/ansible-vault.pass
          IMAGE_TAG: ${{ github.sha }}
        run: |
          ansible-playbook \
            -i inventories/for_flask \
            --limit f_public_server1 \
            -e "local_db_dump=$RUNNER_TEMP/db-backup/db.dump" \
            -e "image_tag=$IMAGE_TAG" \
            --tags gh-action \
            flask-gh.yml 
            

      - name: Remove temporary SSH credentials
        if: always()
        run: |
          rm -f ~/.ssh/ec2_key.pem

      - name: Remove downloaded backup
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/db-backup/db.dump"
