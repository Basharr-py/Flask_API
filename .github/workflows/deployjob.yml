name: Deploy Ansible 

on: 
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure Github OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: 
          aws-region: us-east-1
  
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirement.txt

      - name: Install Ansible
        run: pip install ansible

      - name: Check ansible 
        run: ansible --version