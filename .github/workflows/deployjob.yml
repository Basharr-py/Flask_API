name: Deploy Ansible 

on: 
  workflow_dispatch:

jobs:  
  deploy: 
    runs-on: ubuntu-latest
    steps: 
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirement.txt

      - name: Install Ansible
        run: pip install ansible

      - name: Check ansible 
        run: ansible --version