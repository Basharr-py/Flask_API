name: Multi Job Test

on:
  workflow_dispatch:

jobs:
  first:
    runs-on: ubuntu-latest
    steps:
      - name: Create file
        run: |
          echo "This is job ONE" > hello.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hello-artifact
          path: hello.txt

  second:
    needs: first
    runs-on: ubuntu-latest
    steps:
      - name: Second job
        uses: actions/download-artifact@v4
        with:
          name: hello-artifact

      - name: Read file
        run: cat hello.txt

  build:
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}

    steps:
      - name: Set image tag
        id: tag
        run: echo "image_tag=v1.0.1" >> "$GITHUB_OUTPUT"

  scan:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Show image tag
        run: echo "Scanning ${{ needs.build.outputs.image_tag }}"

